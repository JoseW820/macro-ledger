<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宏观观察台 · 工作台</title>
  <style>
    :root{--navy:#123247;--ink:#263842;--muted:#667680;--line:#dbe3e5;--paper:#f4f7f7;--teal:#147d79;--orange:#bd6a31}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:var(--navy);color:white;padding:24px 15px}.brand-kicker{font-size:11px;letter-spacing:.12em;opacity:.65}.brand h1{font-size:22px;margin:3px 0 28px}.nav-title{font-size:11px;opacity:.6;margin:22px 10px 7px}.nav{display:block;color:#d9e4e8;text-decoration:none;padding:10px 12px;border-radius:5px}.nav.active,.nav:hover{background:#21465b;color:white}.main{padding:28px 34px;max-width:1380px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.top h2{margin:0;font-size:22px}.controls{display:flex;gap:8px;align-items:center}select,button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 12px;color:var(--ink)}button{background:var(--navy);border-color:var(--navy);color:#fff;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:15px}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:22px;color:var(--teal);margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto}.panel-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panel-head h3{margin:0;font-size:15px}.panel-head span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px;background:#fafcfc}.status{color:var(--teal)}.missing{color:var(--orange)}.note{color:var(--muted);font-size:12px;margin:14px 0}@media(max-width:800px){.layout{display:block}aside{display:none}.main{padding:20px 16px}.top{display:block}.controls{margin-top:12px}.summary{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><div class="layout"><aside><div class="brand"><div class="brand-kicker">MACRO DESK</div><h1>宏观观察台</h1></div><div class="nav-title">工作台</div><a class="nav" href="/">月度报告</a><a class="nav" data-view="matrix" href="/workbench?view=matrix">完整数据矩阵</a><a class="nav" data-view="history" href="/workbench?view=history">核心指标走势</a><div class="nav-title">资料库</div><a class="nav" data-view="uploads" href="/workbench?view=uploads">已上传文件</a><a class="nav" data-view="quality" href="/workbench?view=quality">数据质量</a><a class="nav" data-view="sources" href="/workbench?view=sources">官方数据公布</a><a class="nav" data-view="archive" href="/workbench?view=archive">月份归档</a><a class="nav" data-view="definitions" href="/workbench?view=definitions">指标与口径</a></aside><main class="main"><div class="top"><div><h2 id="title">完整数据矩阵</h2><div id="subtitle" class="note">查看当前月份全部配置指标和数据状态</div></div><div class="controls"><select id="period" aria-label="选择报告期"></select><button id="refresh">刷新当前月份</button></div></div><div class="summary"><div class="stat"><small>月度数据包</small><strong id="monthly">—</strong></div><div class="stat"><small>季度数据</small><strong id="quarterly">—</strong></div><div class="stat"><small>全部配置指标</small><strong id="all">—</strong></div><div class="stat"><small>分析结果</small><strong id="analysis">未导入</strong></div></div><section id="view" class="view"><div class="panel"><div class="panel-head"><h3>全部指标</h3></div><div class="empty">正在读取…</div></div></section></main></div><script>
(()=>{const $=id=>document.getElementById(id),period=$("period"),view=$("view"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])),fmt=v=>v==null?"—":Number(v).toLocaleString("zh-CN",{maximumFractionDigits:2});const meta={matrix:["完整数据矩阵","查看当前月份全部配置指标和数据状态"],history:["核心指标走势","选择指标查看已导入历史序列"],uploads:["已上传文件","查看当前月份文件记录和版本"],quality:["数据质量","查看当前月份缺失和完整度"],sources:["官方数据公布","各官方来源的数据公布说明"],archive:["月份归档","按月份查看数据和报告状态"],definitions:["指标与口径","查看当前配置的指标定义"]};async function get(u){const r=await fetch(u);return r.json()}async function load(){const p=(await get("/api/periods")).periods||[];period.innerHTML=p.map(x=>`<option value="${x}">${x}</option>`).join("");if(p.length&&!period.value)period.value=p[0];await render()}async function render(){const v=new URLSearchParams(location.search).get("view")||"matrix";$("title").textContent=(meta[v]||meta.matrix)[0];$("subtitle").textContent=(meta[v]||meta.matrix)[1];document.querySelectorAll(".nav[data-view]").forEach(a=>a.classList.toggle("active",a.dataset.view===v));const d=await get("/api/dashboard?period="+encodeURIComponent(period.value)),s=d.package_status||{};$("monthly").textContent=`${s.monthly_available||0}/${s.monthly_total||0}`;$("quarterly").textContent=`${s.quarterly_available||0}/${s.quarterly_total||0}`;$("all").textContent=`${s.all_available||0}/${s.all_total||0}`;$("analysis").textContent=d.analysis_status==="confirmed"?"已确认":"未导入";if(v==="matrix")view.innerHTML=`<div class="panel"><div class="panel-head"><h3>全部指标</h3><span>${d.rows.length} 项</span></div><table><thead><tr><th>指标</th><th>主题</th><th>最新值</th><th>统计期</th><th>状态</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.theme)}</td><td>${fmt(r.value)}</td><td>${esc(period.value)}</td><td>${esc(r.status)}</td></tr>`).join("")}</tbody></table></div>`;else if(v==="sources")view.innerHTML=`<div class="cards"><div class="info-card"><h4>国家统计局</h4><p>工业、消费、投资、价格、PMI、利润、发电量等，按官网月度或季度公布文件导入。</p></div><div class="info-card"><h4>中国人民银行</h4><p>M0、M1、M2、社融、贷款、存款、LPR 等，按官方公告或附件导入。</p></div><div class="info-card"><h4>项目原则</h4><p>数据由用户从官方网页或附件下载后上传，不假设官网提供稳定 API。</p></div></div>`;else if(v==="quality")view.innerHTML=`<div class="cards"><div class="info-card"><h4>月度数据包</h4><p>${s.monthly_available||0}/${s.monthly_total||0} 项已导入</p></div><div class="info-card"><h4>季度数据</h4><p>${s.quarterly_available||0}/${s.quarterly_total||0} 项已导入</p></div><div class="info-card"><h4>全部配置指标</h4><p>${s.all_available||0}/${s.all_total||0} 项已导入</p></div></div>`;else view.innerHTML=`<div class="panel empty"><h3>${meta[v]?.[0]||"工作台"}</h3><p>请选择左侧导航中的具体模块。</p></div>`}function nav(v){history.pushState({},"",`/workbench?view=${v}`);render()}document.querySelectorAll(".nav[data-view]").forEach(a=>a.onclick=e=>{e.preventDefault();nav(a.dataset.view)});onpopstate=render;period.onchange=render;$("refresh").onclick=render;load()})();
  </script></body></html>
