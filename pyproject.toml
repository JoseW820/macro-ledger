[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-ledger"
version = "0.1.0"
description = "A practical monthly macroeconomic data ledger and reporting tool for structured analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Macro Ledger contributors" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
spreadsheets = [
  "openpyxl>=3.1",
]

[project.scripts]
macro-ledger = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "macro_observer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
